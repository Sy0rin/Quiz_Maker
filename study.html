<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respiratory Physiology Quiz</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .question { margin-bottom: 20px; }
        .question h2 { font-size: 18px; }
        .options { list-style-type: none; padding: 0; }
        .options li { margin: 5px 0; }
        .feedback { margin-top: 10px; font-weight: bold; }
        button { margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Respiratory Physiology Quiz</h1>
    <div id="quiz"></div>
    <button onclick="showScore()">Show Score</button>
    <div id="score" class="feedback"></div>

    <script>
        const quizData = [
  {
    "question": "Which instrument side is used to hear high frequency sounds like wheezing?",
    "options": ["Bell", "Diaphragm", "Stethoscope tube", "Auscultator base"],
    "answer": 1
  },
  {
    "question": "Which lung sound is characterized by a harsh, hollow, tubular quality and is normally heard over the trachea?",
    "options": ["Bronchial", "Vesicular", "Bronchovesicular", "Crackles"],
    "answer": 0
  },
  {
    "question": "Crackles are caused by:",
    "options": ["Airway constriction", "Obstruction", "Spontaneous opening of small airways", "Fluid in pleural space"],
    "answer": 2
  },
  {
    "question": "Which sound is a harsh vibrating noise caused by airway obstruction?",
    "options": ["Stridor", "Wheezing", "Crackles", "Rhonchi"],
    "answer": 0
  },
  {
    "question": "The P wave on an ECG represents:",
    "options": ["Atrial depolarization", "Ventricular depolarization", "Ventricular repolarization", "Atrial repolarization"],
    "answer": 0
  },
  {
    "question": "A PR interval longer than 0.2 seconds suggests which condition?",
    "options": ["First-degree AV block", "Atrial flutter", "Sinus bradycardia", "Bundle branch block"],
    "answer": 0
  },
  {
    "question": "Which AV block type features progressively lengthening PR intervals?",
    "options": ["Mobitz II", "Wenckebach (Mobitz I)", "Third-degree block", "First-degree block"],
    "answer": 1
  },
  {
    "question": "In third-degree AV block:",
    "options": ["There is no relationship between P and QRS", "PR intervals gradually increase", "Some P waves are not followed by QRS", "QRS complexes are always wide"],
    "answer": 0
  },
  {
    "question": "A bundle branch block is indicated by:",
    "options": ["A single R wave", "ST elevation", "Two R waves", "T wave inversion"],
    "answer": 2
  },
  {
    "question": "Which arrhythmia involves multiple atrial foci and chaotic atrial spikes?",
    "options": ["Atrial fibrillation", "Atrial flutter", "Ventricular flutter", "PAC"],
    "answer": 0
  },
  {
    "question": "Atrial flutter typically shows what characteristic rhythm?",
    "options": ["Sawtooth pattern, 250-300 bpm", "Wide QRS complex", "Narrow QRS with dropped beats", "Flatline atria"],
    "answer": 0
  },
  {
    "question": "Diffuse crackles and atelectasis in a post-op patient most likely result from:",
    "options": ["Body position reluctance", "Fever", "Infection", "Asthma"],
    "answer": 0
  },
  {
    "question": "What color appears on a chest x-ray when an area is radiolucent (air-filled)?",
    "options": ["White", "Gray", "Black", "Light blue"],
    "answer": 2
  },
  {
    "question": "On a PA chest x-ray film, the heart appears:",
    "options": ["Smaller and sharper", "Larger and blurrier", "Magnified", "More lateral"],
    "answer": 0
  },
  {
    "question": "What radiographic sign is typical of pulmonary edema?",
    "options": ["Butterfly pattern", "Plate-like infiltrates", "No vascular markings", "Tombstone heart"],
    "answer": 0
  },
  {
    "question": "Which condition causes the trachea to shift toward the affected side?",
    "options": ["Atelectasis", "Pleural effusion", "Pneumothorax", "Pulmonary edema"],
    "answer": 0
  },
  {
    "question": "What radiographic pattern is associated with ARDS?",
    "options": ["Ground glass appearance", "Butterfly pattern", "Plate-like shadows", "Hyperlucency"],
    "answer": 0
  },
  {
    "question": "Best treatment strategy for ARDS includes:",
    "options": ["Low tidal volumes and PEEP", "High tidal volume and zero PEEP", "Large fluid bolus", "Bronchodilator therapy"],
    "answer": 0
  },
  {
    "question": "Tactile fremitus during palpation is increased in cases of:",
    "options": ["Consolidation", "Pneumothorax", "Emphysema", "Hyperresonance"],
    "answer": 0
  },
  {
    "question": "A hyperresonant percussion note suggests:",
    "options": ["Normal lungs", "Pneumonia", "Pneumothorax", "Pleural effusion"],
    "answer": 2
  },
  {
    "question": "Tympanic percussion sounds indicate:",
    "options": ["Consolidation", "Air collection", "Fluid buildup", "Atelectasis"],
    "answer": 1
  },
  {
    "question": "Dullness to percussion is found over:",
    "options": ["Hyperinflated lungs", "Air trapping", "Pleural effusion", "Open airway"],
    "answer": 2
  },
  {
    "question": "Which of the following is most sensitive to electrical interference during ECG?",
    "options": ["P wave", "60-cycle rhythm", "PR interval", "QRS complex"],
    "answer": 1
  },
  {
    "question": "What is the first physiological sign of hypoxia?",
    "options": ["Cyanosis", "Tachycardia", "Bradycardia", "Decreased respiratory rate"],
    "answer": 1
  },
  {
    "question": "A narrow QRS complex with no visible P wave indicates stimulation at the:",
    "options": ["SA node", "Ventricular wall", "AV node", "Purkinje fibers"],
    "answer": 2
  },
  {
    "question": "Which ECG pattern is typically caused by ventricular fibrillation?",
    "options": ["Chaotic, wide complex rhythm", "Sawtooth P waves", "Dropped QRS", "Irregular narrow complex rhythm"],
    "answer": 0
  },
  {
    "question": "A PAC is best described as:",
    "options": ["Early P wave with abnormal shape", "Wide QRS with no P wave", "Sawtooth atrial rhythm", "Dropped beat"],
    "answer": 0
  },
  {
    "question": "Which condition produces the 'tombstone sign' on x-ray?",
    "options": ["Emphysema", "Pneumonia", "Pleural effusion", "ARDS"],
    "answer": 0
  },
  {
    "question": "Guillain-Barré syndrome affects respiratory mechanics by:",
    "options": ["Causing diaphragmatic weakness", "Increasing airway resistance", "Causing consolidation", "Triggering asthma"],
    "answer": 0
  },
  {
    "question": "Which of the following causes increased PIP due to airway resistance?",
    "options": ["Kinked endotracheal tube", "Pulmonary edema", "ARDS", "Atelectasis"],
    "answer": 0
  }
];


        let score = 0;

        function loadQuiz() {
            const quizContainer = document.getElementById("quiz");
            quizContainer.innerHTML = "";
            quizData.forEach((data, index) => {
                const questionDiv = document.createElement("div");
                questionDiv.classList.add("question");

                const questionTitle = document.createElement("h2");
                questionTitle.innerText = (index + 1) + ". " + data.question;
                questionDiv.appendChild(questionTitle);

                const optionsList = document.createElement("ul");
                optionsList.classList.add("options");

                data.options.forEach((option, i) => {
                    const optionItem = document.createElement("li");
                    const optionButton = document.createElement("button");
                    optionButton.innerText = option;
                    optionButton.onclick = () => checkAnswer(index, i, optionButton);
                    optionItem.appendChild(optionButton);
                    optionsList.appendChild(optionItem);
                });

                questionDiv.appendChild(optionsList);
                quizContainer.appendChild(questionDiv);
            });
        }

        function checkAnswer(questionIndex, optionIndex, button) {
            const isCorrect = optionIndex === quizData[questionIndex].answer;
            console.log('Question: ' + (questionIndex + 1) + ' Answer: ' + quizData[questionIndex].answer);
            const feedback = document.createElement("div");
            feedback.classList.add("feedback");
            feedback.innerText = isCorrect ? "Correct!" : "Incorrect!";
            button.parentNode.appendChild(feedback);

            if (isCorrect) {
                score++;
            }

            // Disable all options for the current question
            const options = button.parentNode.parentNode.querySelectorAll("button");
            options.forEach(btn => btn.disabled = true);
        }

        function showScore() {
            const scoreContainer = document.getElementById("score");
            scoreContainer.innerText = "You scored " + score + " out of " + quizData.length;
        }

        loadQuiz();
    </script>
</body>
</html>
